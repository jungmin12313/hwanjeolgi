<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환절기 편집국 현황판</title>
<link href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gothic+A1:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<style>
  :root{--ink:#1B1918;--sub:#6E685F;--line:#E4E0DA;--faint:#B5AFA7;--bg:#FFFFFF;--warn:#B3261E;--ok:#2E6B3F;--wait:#9A6B00}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Gothic A1',sans-serif;font-size:15px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:28px 28px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{font-family:'East Sea Dokdo',cursive;font-size:48px;line-height:.8}
  h1{margin:0;display:flex;align-items:flex-end;gap:14px;font-size:18px;font-weight:800}
  .upd{font-size:13px;color:var(--sub)}
  main{padding:20px 28px 60px;max-width:1200px;margin:0 auto}
  .alert{margin:0 0 22px;font-size:15px;font-weight:700}
  .alert b{color:var(--warn)}
  .proj{padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .proj:hover .ttl{text-decoration:underline}
  .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
  .ttl{font-size:20px;font-weight:900}
  .meta{font-size:13px;color:var(--sub)}
  .state{font-size:13px;font-weight:800}
  .state.wait{color:var(--wait)} .state.hold{color:var(--warn)} .state.ok{color:var(--ok)}
  .steps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:16px 0 12px}
  .step{font-size:12px;font-weight:700;color:var(--faint);padding-top:8px;border-top:4px solid var(--line)}
  .step.done{color:var(--ink);border-color:var(--ink)}
  .step.now{color:var(--warn);border-color:var(--warn)}
  .line{font-size:14px;line-height:1.7;margin:2px 0}
  .line span{display:inline-block;min-width:76px;color:var(--sub);font-weight:700}
  .pub{color:var(--warn);font-weight:800}
  .thumbs{display:flex;gap:8px;margin-top:12px;overflow-x:auto}
  .thumbs img{height:120px;border:1px solid var(--line)}
  .draft{font-size:12px;color:var(--warn);font-weight:800}
  dialog{border:none;padding:0;width:min(900px,96vw);max-height:92vh}
  dialog::backdrop{background:rgba(0,0,0,.45)}
  .dlg{padding:24px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0;border-bottom:1px solid var(--line);padding-bottom:10px}
  .tabs button{font-family:inherit;font-size:13px;font-weight:700;border:1px solid var(--line);background:#fff;padding:7px 11px;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs button.empty{color:var(--faint)}
  .doc{font-size:14px;line-height:1.75;overflow:auto;max-height:62vh}
  .doc table{border-collapse:collapse;font-size:13px;margin:8px 0}
  .doc th,.doc td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
  .doc pre{white-space:pre-wrap;background:#F6F4F1;padding:10px}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
  .gal img{width:100%;border:1px solid var(--line)}
  .close{float:right;font-family:inherit;border:1px solid var(--line);background:#fff;padding:6px 12px;cursor:pointer;font-weight:700}
  @media(max-width:700px){header,main{padding-left:16px;padding-right:16px}.steps{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <h1><span class="logo">환절기</span> 편집국 현황판</h1>
  <div class="upd" id="upd"></div>
</header>
<main>
  <p class="alert" id="alert"></p>
  <div id="list"></div>
</main>
<dialog id="dlg"><div class="dlg">
  <button class="close" type="button" onclick="dlg.close()">닫기</button>
  <div class="ttl" id="dTitle"></div><div class="meta" id="dMeta"></div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="doc" id="doc"></div>
</div></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls = s => /보류|반려/.test(s) ? 'hold' : /대기/.test(s) ? 'wait' : /발행|완료|게시/.test(s) ? 'ok' : '';
let DATA;
fetch('status.json?' + Date.now()).then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => { $('list').textContent = '현황 데이터를 불러오지 못했어요.'; });
function render() {
  $('upd').textContent = `마지막 갱신 ${DATA.updated}`;
  const need = DATA.projects.filter(p => p.needsPublisher);
  $('alert').innerHTML = need.length ? `발행인 확인이 필요한 편 <b>${need.length}건</b> — ${need.map(p => esc(p.title)).join(', ')}` : '지금 발행인이 확인할 일은 없어요.';
  $('list').innerHTML = DATA.projects.map((p, i) => `
    <article class="proj" onclick="openP(${i})" tabindex="0" onkeydown="if(event.key==='Enter')openP(${i})">
      <div class="top"><div><div class="ttl">${esc(p.title)}</div><div class="meta">${esc(p.date)} 발행 예정 · ${esc(p.series || '')}</div></div>
      <div class="state ${cls(p.state)}">${esc(p.state)}${p.score != null ? ` · 심사 ${p.score}점` : ''}</div></div>
      <div class="steps">${DATA.stages.map((s, k) => `<div class="step ${k + 1 < p.stage ? 'done' : k + 1 === p.stage ? 'now' : ''}">${k + 1}. ${s}</div>`).join('')}</div>
      ${p.blocker ? `<p class="line"><span>막힌 이유</span>${esc(p.blocker)}</p>` : ''}
      ${p.next ? `<p class="line"><span>다음 할 일</span>${esc(p.next)}</p>` : ''}
      ${p.needsPublisher ? `<p class="line pub">▶ 발행인 확인 필요</p>` : ''}
      ${p.pngs.length ? `${p.draft ? '<div class="draft">시안 (게시 불가)</div>' : ''}<div class="thumbs">${p.pngs.slice(0, 8).map(x => `<img src="${esc(x)}" alt="" loading="lazy">`).join('')}</div>` : ''}
    </article>`).join('');
}
function openP(i) {
  const p = DATA.projects[i];
  $('dTitle').textContent = p.title; $('dMeta').textContent = `${p.date} · ${p.state}${p.score != null ? ' · 심사 ' + p.score + '점' : ''}`;
  const tabs = [...p.docs.map(d => ({ label: d.label, empty: !d.filled, html: d.file.endsWith('.md') ? marked.parse(d.text) : `<pre>${esc(d.text)}</pre>` }))];
  if (p.pngs.length) tabs.push({ label: p.draft ? 'PNG 시안' : 'PNG', html: `<div class="gal">${p.pngs.map(x => `<a href="${esc(x)}" target="_blank"><img src="${esc(x)}" alt=""></a>`).join('')}</div>` });
  $('tabs').innerHTML = tabs.map((t, k) => `<button type="button" role="tab" class="${t.empty ? 'empty' : ''}" aria-selected="${k === 0}" data-k="${k}">${esc(t.label)}</button>`).join('');
  const show = k => { [...$('tabs').children].forEach((b, j) => b.setAttribute('aria-selected', j === k)); $('doc').innerHTML = tabs[k].html; };
  $('tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); };
  show(0); $('dlg').showModal();
}
</script>
</body>
</html>
